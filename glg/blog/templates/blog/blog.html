{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aclonica&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aclonica&family=Poppins:ital,wght@0,100;0,200;
    0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/blog.css'%}">
</head>
<body>
    <nav class="aclonica-regular">
        <h2 class="logo">GREEN LAND<BR>GOAL</h2>
            <h2>HOME</h2>
            <h2>PRODUCTS</h2>
            <h2>BLOG</h2>
            <h2>ABOUT</h2>
    </nav>
    <div class="main">
        <div class="content">
            <h1 class="title"></h1>
            <p class="post">
            <div class="main_image"><img src="{{blog.image.url}}" ><figcaption>A palm in a vase</figcaption></div>
               {{blog.content}} 
    </p>
        </div>
    </div>
    <div class="shop">
        {% for item in shop %}
            <div class="item">
                <img src="{{item.image.url}}" class="fullimage" alt="">
                <a href="{{ item.get_absolute_url }}"><button type="button">SHOP NOW!</button></a>
            </div>
        {% endfor %}
        
    </div>
    
</body>
</html>
