<div class="regular_price" id="shopitems">
    {% for item in items %}
    <a href="{{ item.get_absolute_url }}">
        <div class="product">
            <div>
                <img src="{{ item.image.url }}" alt="{{item.product_id}}">
            </div>
            <div class="details">
                <p>{{item.name}}</p>
                <p>Ksh. {{item.price}}</p>
            </div>
        </div>
    </a>
    {% endfor %}
</div>
