
{% extends 'adminpanel/adminpanel.html' %}
{% load static %}
{% block link %}
    <script src="{% static 'js/htmx.min.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/users.css' %}">
{% endblock%}
{% block body %}
<form action="{% url 'adminpanel:users' %}" method="post">
    <table>
        <tr>
            <th>Name:</th>
            <th>Email:</th>
            <th>Level:</th>
            <th></th>
            <th></th>
        </tr>
        {% for user in users %}
            <tr>
                <td style="width: 1em;">{{user.first_name}}</td>
                <td style="width: 1em;">{{user.email}}</td>
                <td>{{user.}}</td>
                <td><button>Edit</button></td>
                <td><button>Delete</button></td>
            </tr>
        {% endfor %}
    </table>
</form>

{% endblock%}
